[project]
name = "tomd"
version = "0.0.0"
description = "Local converter from PDF, EPUB and Wikipedia articles to deterministic Markdown."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
# Phase 5 benchmark only (ADR-015): pulls PyTorch and layout models (several GB).
docling = ["docling>=2.0"]

[project.scripts]
tomd = "tomd.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.169.4",
    "lxml-stubs>=0.5.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "mypy>=1.11",
    "pypandoc-binary>=1.17",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.0.1",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
    "types-reportlab>=5.0.0.20261008",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is data (corpus expected.md files), never reformatted: ruff would rewrite the
# code blocks inside it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
# The PDF reader handles typographic characters (dashes, bullets, ×) by design.
"src/tomd/readers/pdf/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: OCR or heavy backends; excluded with -m \"not slow\"",
]

[[tool.mypy.overrides]]
# pypdfium2 ships no type information (ADR-014); its use is confined to readers/pdf/extract.py.
module = ["pypdfium2", "pypdfium2.*", "docling", "docling.*", "pypandoc", "pytesseract", "pytesseract.*"]
ignore_missing_imports = true
